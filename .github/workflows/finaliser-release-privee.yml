name: Finaliser la préversion privée v0.2.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finaliser-release-privee.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finaliser:
    name: Vérifier les six voix puis publier dans le dépôt privé
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Sources versionnées
        uses: actions/checkout@v4
      - name: Exiger un dépôt privé et un brouillon v0.2.0
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == "v0.2.0" and .draft == true) | .id')"
          test -n "$RELEASE_ID"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[].name' > /tmp/assets.txt
          for file in glycemie-installation-ecran-v0.2.0.zip GlycemieConnexion.exe SHA256SUMS.txt SOURCE_COMMIT.txt; do
            grep -Fxq "$file" /tmp/assets.txt
          done
          if grep -Fxq "glycemie-microSD-v0.2.0.zip" /tmp/assets.txt; then
            echo "Archive déjà jointe : vérifier manuellement avant de recommencer."
            exit 1
          fi
      - name: Télécharger les voix originales et leur somme de contrôle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _voice
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'glycemie-microSD.zip' --pattern 'SHA256SUMS.txt' --dir _voice
      - name: Reconditionner et vérifier les 2376 WAV
        run: |
          set -euo pipefail
          python3 tools/release_voice_archive.py \
            --archive _voice/glycemie-microSD.zip \
            --historical-sha _voice/SHA256SUMS.txt \
            --out _voice/public
          (cd _voice/public && sha256sum -c SHA256SUMS-voix.txt)
      - name: Attacher le seul paquet audio nettoyé et son empreinte
        shell: bash
        run: |
          set -euo pipefail
          for filename in glycemie-microSD-v0.2.0.zip SHA256SUMS-voix.txt; do
            file="_voice/public/$filename"
            mimetype="application/zip"
            if [ "$filename" = "SHA256SUMS-voix.txt" ]; then
              mimetype="text/plain"
            fi
            curl --fail-with-body --silent --show-error --retry 3 \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: $mimetype" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$filename" \
              > /tmp/last_uploaded_asset.json
            jq -e --arg filename "$filename" '.name == $filename and .state == "uploaded"' /tmp/last_uploaded_asset.json
          done
      - name: Recontrôler tous les téléchargements et publier la préversion
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[].name' > /tmp/all_assets.txt
          for filename in glycemie-installation-ecran-v0.2.0.zip GlycemieConnexion.exe \
             SHA256SUMS.txt SOURCE_COMMIT.txt glycemie-microSD-v0.2.0.zip SHA256SUMS-voix.txt; do
            grep -Fxq "$filename" /tmp/all_assets.txt
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          notes = Path('docs/RELEASE_NOTES_0_2_0.md').read_text(encoding='utf-8')
          Path('/tmp/release_payload.json').write_text(
              json.dumps({'body': notes, 'draft': False, 'prerelease': True,
                          'target_commitish': __import__('os').environ['GITHUB_SHA'],
                          'make_latest': 'false'}, ensure_ascii=False),
              encoding='utf-8')
          PY
          # La visibilité du dépôt n'est jamais modifiée.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --input /tmp/release_payload.json --jq '{tag_name, draft, prerelease, html_url}'
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
      - name: Archiver l'ancienne préversion dans les brouillons
        shell: bash
        run: |
          set -euo pipefail
          OLD_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
             --jq '.[] | select(.tag_name == "v0.1.0") | .id')"
          if [ -n "$OLD_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$OLD_ID" \
              -F draft=true -F prerelease=true --jq '{tag_name, draft}'
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          echo "Préversion 0.2.0 publiée dans le dépôt PRIVE. 0.1.0 archivée."
