# Run host C/Python regression tests and validate the Windows application.
name: Hardware-independent tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: C and Python host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run C tests with GCC
        run: python tests/run_tests.py
      - name: Check repository consistency
        run: python tests/test_depot.py
      - name: Ensure English-only Markdown documentation
        run: python tests/test_english_docs.py
      - name: Validate language and speech resources
        run: python tests/test_langues_voix.py
      - name: Test USB assistant (simulation)
        run: python tests/test_assistant_config.py
      - name: Test microSD recovery (simulation)
        run: python tests/test_recuperation_microsd.py
      - name: Test voice transfers (simulation)
        run: python tests/test_sd_voice_upload.py
      - name: Test release package (fixtures)
        run: python tests/test_pack_release.py

  windows-app:
    name: Windows setup application (without hardware)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Windows application
        run: python tests/test_pc_app.py
      - name: Install PyInstaller
        run: py -3 -m pip install pyinstaller
      - name: Check USB installer syntax
        shell: pwsh
        run: |
          $tok = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/installer.ps1').Path, [ref]$tok, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Out-String | Write-Host; exit 1 }
      - name: Build Windows executable
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/pc_app/construire_exe.ps1
      - name: Store tested Windows executable (private repo)
        uses: actions/upload-artifact@v4
        with:
          name: GlycemieConnexion-${{ github.sha }}
          path: tools/pc_app/dist/GlycemieConnexion.exe
          if-no-files-found: error
          retention-days: 30
