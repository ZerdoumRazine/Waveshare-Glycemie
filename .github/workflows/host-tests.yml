# EN: Run host C/Python regression tests and validate the Windows application.
# FR: Lance les tests C/Python et vérifie l'application Windows.
name: Tests hors matériel

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Tests C et Python (sans écran)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests C compilés avec GCC
        run: python tests/run_tests.py
      - name: Cohérence du dépôt
        run: python tests/test_depot.py
      - name: Traductions et banques vocales
        run: python tests/test_langues_voix.py
      - name: Assistant USB (simulation)
        run: python tests/test_assistant_config.py
      - name: Sauvegarde microSD (simulation)
        run: python tests/test_recuperation_microsd.py
      - name: Transfert des annonces (simulation)
        run: python tests/test_sd_voice_upload.py
      - name: Paquet d'installation (fichiers factices)
        run: python tests/test_pack_release.py

  windows-app:
    name: Application de configuration Windows (sans écran)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests de l'application Windows
        run: python tests/test_pc_app.py
      - name: Installer l'outil de construction Windows
        run: py -3 -m pip install pyinstaller
      - name: Vérifier la syntaxe de l'installateur USB
        shell: pwsh
        run: |
          $tok = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/installer.ps1').Path, [ref]$tok, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Out-String | Write-Host; exit 1 }
      - name: Construire l'executable Windows
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/pc_app/construire_exe.ps1
      - name: Conserver l'executable verifie (depot prive)
        uses: actions/upload-artifact@v4
        with:
          name: GlycemieConnexion-${{ github.sha }}
          path: tools/pc_app/dist/GlycemieConnexion.exe
          if-no-files-found: error
          retention-days: 30
