# Validate real WAV banks against the manifest and reject private data.
name: Verify microSD audio

on:
  pull_request:
    paths:
      - ".github/workflows/voice-preflight.yml"
      - "tools/release_voice_archive.py"
      - "tests/test_release_voice_archive.py"
      - "tools/voice/sd_voice_upload.py"
      - "tests/test_sd_voice_upload.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-bank:
    name: Check six voice languages and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test offline safety checks
        run: python tests/test_release_voice_archive.py
      # v0.1.0 is archived as a draft; check the published v0.2.0 assets instead.
      - name: Download existing pre-release voice bank
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _voice
          gh release download v0.2.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'glycemie-microSD-v0.2.0.zip' \
            --pattern 'SHA256SUMS-voix.txt' \
            --dir _voice
          (cd _voice && sha256sum -c SHA256SUMS-voix.txt)
      - name: Verify 2,376 WAV files and privacy
        run: |
          python - <<'PY'
          import csv
          import io
          from pathlib import Path
          import re
          import wave
          import zipfile
          expected = {
              row['fichier']
              for row in csv.DictReader(
                  Path('assets/banque_vocale_manifeste.csv').open(
                      encoding='utf-8-sig', newline=''), delimiter=';')
          }
          assert len(expected) == 396
          languages = ('fr', 'en', 'es', 'de', 'it', 'pt')
          found = {lang: set() for lang in languages}
          root = 'glycemie/audio/voice/'
          archive = '_voice/glycemie-microSD-v0.2.0.zip'
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              names = z.namelist()
              assert len(names) == 2377
              for name in names:
                  if name == 'PROVENANCE_VOIX.txt':
                      continue
                  assert name.startswith(root), name
                  parts = name[len(root):].split('/')
                  if len(parts) == 1:
                      lang, filename = 'fr', parts[0]
                  else:
                      assert len(parts) == 2 and parts[0] in languages[1:], name
                      lang, filename = parts
                  assert re.fullmatch(r'[a-zA-Z0-9_-]+\.wav', filename), name
                  assert filename in expected and filename not in found[lang], name
                  found[lang].add(filename)
                  with wave.open(io.BytesIO(z.read(name)), 'rb') as wav:
                      assert (wav.getnchannels(), wav.getsampwidth(),
                              wav.getframerate()) == (1, 2, 16000), name
                      assert wav.getnframes() > 0, name
              assert all(found[lang] == expected for lang in languages)
              notice = z.read('PROVENANCE_VOIX.txt').decode('utf-8')
              assert 'Google Cloud Text-to-Speech' in notice
              print('OK: 6 x 396 WAV, PCM mono 16 kHz, CRC, provenance, no private files')
          PY
