name: Préparer la préversion privée v0.2.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-draft-v020.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Régressions hors matériel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests C GCC
        run: python tests/run_tests.py
      - name: Vérifications de confidentialité et de structure
        run: python tests/test_depot.py
      - name: Tests de langue
        run: python tests/test_langues_voix.py
      - name: Assistant USB
        run: python tests/test_assistant_config.py
      - name: Carte mémoire
        run: python tests/test_recuperation_microsd.py
      - name: Voix sur microSD
        run: python tests/test_sd_voice_upload.py
      - name: Vérifier la fabrication des ZIP
        run: python tests/test_pack_release.py

  firmware:
    name: Compiler et vérifier ESP32-P4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Compiler sans données privées
        shell: bash
        run: |
          test ! -e private/device_secrets.h
          source "$IDF_PATH/export.sh"
          idf.py --version
          idf.py set-target esp32p4
          idf.py build
          python tools/verif_avant_flash.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-public
          path: |
            build/glycemie_display.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Construire la configuration Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tester l'application
        run: python tests/test_pc_app.py
      - name: Vérifier syntaxe installateur PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/installer.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Out-String | Write-Host; exit 1 }
      - name: Installer PyInstaller
        run: py -3 -m pip install pyinstaller
      - name: Construire l'exécutable
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/pc_app/construire_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: application-windows
          path: tools/pc_app/dist/GlycemieConnexion.exe
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Livrer uniquement un brouillon privé
    needs: [tests, firmware, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: firmware-public
          path: _firmware
      - uses: actions/download-artifact@v4
        with:
          name: application-windows
          path: _windows
      - name: Vérifier et préparer le ZIP d'installation
        run: |
          python tools/pack_release.py --build _firmware --exe _windows/GlycemieConnexion.exe --out _release
          sha256sum -c _release/SHA256SUMS.txt --ignore-missing || (cd _release && sha256sum -c SHA256SUMS.txt)
      - name: Créer la version v0.2.0 en brouillon (jamais publique)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "La version v0.2.0 existe deja. Rien n'est remplace."
            exit 1
          fi
          gh release create v0.2.0             --target "$GITHUB_SHA"             --title "v0.2.0 — corrections et installation (préversion)"             --notes-file docs/RELEASE_NOTES_0_2_0.md             --draft --prerelease             _release/glycemie-installation-ecran-v0.2.0.zip             _release/GlycemieConnexion.exe             _release/SHA256SUMS.txt             _release/SOURCE_COMMIT.txt
          echo "Brouillon cree ; la visibilite du depot ne change pas."
