# Assemble verified release assets only after required jobs succeed.
name: Prepare private v0.2.0 pre-release

# Manual maintenance only: this historical v0.2.0 release already exists.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Host regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run C tests with GCC
        run: python tests/run_tests.py
      - name: Check privacy and repository structure
        run: python tests/test_depot.py
      - name: Run language tests
        run: python tests/test_langues_voix.py
      - name: Test USB assistant
        run: python tests/test_assistant_config.py
      - name: Test microSD backup
        run: python tests/test_recuperation_microsd.py
      - name: Test microSD speech transfer
        run: python tests/test_sd_voice_upload.py
      - name: Check ZIP packaging
        run: python tests/test_pack_release.py

  firmware:
    name: Build and verify ESP32-P4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware without private credentials
        shell: bash
        run: |
          test ! -e private/device_secrets.h
          source "$IDF_PATH/export.sh"
          idf.py --version
          idf.py set-target esp32p4
          idf.py build
          python tools/verif_avant_flash.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-public
          path: |
            build/glycemie_display.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Build Windows configuration app
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Windows application
        run: python tests/test_pc_app.py
      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/installer.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Out-String | Write-Host; exit 1 }
      - name: Install PyInstaller
        run: py -3 -m pip install pyinstaller
      - name: Build executable
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/pc_app/construire_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: application-windows
          path: tools/pc_app/dist/GlycemieConnexion.exe
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Prepare private draft only
    needs: [tests, firmware, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: firmware-public
          path: _firmware
      - uses: actions/download-artifact@v4
        with:
          name: application-windows
          path: _windows
      - name: Verify and package installation ZIP
        run: |
          python tools/pack_release.py --build _firmware --exe _windows/GlycemieConnexion.exe --out _release
          (cd _release && sha256sum -c SHA256SUMS.txt)
      - name: Create v0.2.0 private draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "v0.2.0 already exists. Do not replace its artifacts."
            exit 1
          fi
          gh release create v0.2.0             --target "$GITHUB_SHA"             --title "v0.2.0 — verified firmware pre-release"             --notes-file docs/RELEASE_NOTES_0_2_0.md             --draft --prerelease             _release/glycemie-installation-ecran-v0.2.0.zip             _release/GlycemieConnexion.exe             _release/SHA256SUMS.txt             _release/SOURCE_COMMIT.txt
          echo "Draft created; repository visibility remains private."
