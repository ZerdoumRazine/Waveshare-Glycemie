name: Complete English-only developer documentation

on:
  push:
    branches:
      - documentation/english-only-20261024
    paths:
      - .github/workflows/english-migration-once.yml

permissions:
  contents: write

jobs:
  migrate:
    name: Convert remaining developer comments and docstrings
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out the documentation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: documentation/english-only-20261024
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline translation engine
        run: python -m pip install "argostranslate>=1.9,<2.0"
      - name: Complete English-only comments and docstrings without touching UI strings
        run: python tools/finish_english_comments.py --apply
      - name: Check Python syntax and whitespace
        run: |
          python -m compileall -q main tools tests
          git diff --check
          git status --short | tail -35
      - name: Save documentation changes on branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Documentation Maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_FR.md CREDITS.md CREDITS_EN.md docs/ assets/README* screenshots/README* tests/ main/ tools/ CMakeLists.txt sdkconfig.defaults partitions.csv
          if git diff --cached --quiet; then
            echo "No documentation changes."
            exit 1
          fi
          git commit -m "Translate remaining French comments and Python docstrings to English"
          git push origin HEAD:documentation/english-only-20261024
