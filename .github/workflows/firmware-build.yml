# Compile and preflight-check the ESP32-P4 firmware without personal credentials.
name: ESP-IDF firmware build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32p4-build:
    name: ESP32-P4 firmware without embedded credentials
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: espressif/idf:v5.5.5
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Activate ESP-IDF and build
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version
          idf.py set-target esp32p4
          idf.py build
          python tools/verif_avant_flash.py
      - name: Store verified firmware binaries (private repo)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32p4-${{ github.sha }}
          path: |
            build/glycemie_display.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error
          retention-days: 30
